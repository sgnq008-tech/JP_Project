<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniLog - HERO LOGIN</title>

  <!-- Google Fonts: アメコミ調英字フォント(Bangers) および 日韓フォントの読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    /* ===================================================
       ヒロアカ(僕のヒーローアカデミア) テーマカラー変数定義
       =================================================== */
    :root {
      --mha-green: #0b6623;         /* デクのコスチューム基本グリーン */
      --mha-teal: #0fa37f;          /* アクセントティールグリーン */
      --mha-bright-green: #00ff87;  /* 発光グリーン(フォーカス・成功表示用) */
      --mha-yellow: #ffde00;        /* タイトル・ボタン強調イエロー */
      --mha-orange: #ff5722;        /* 爆豪風アクセントオレンジ */
      --mha-dark: #121820;          /* 境界線・シャドウ用ダーク */
      --mha-panel-bg: #1c2430;      /* カードパネル背景ダークスレート */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 背景: アメコミ印刷風のハーフトーン・ドットパターン背景 */
    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      background-image:
              radial-gradient(var(--mha-panel-bg) 15%, transparent 16%),
              radial-gradient(var(--mha-dark) 15%, transparent 16%);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ログインカードコンテナ */
    .login-card {
      background-color: var(--mha-panel-bg);
      border: 4px solid var(--mha-teal);
      border-radius: 16px;
      box-shadow: 12px 12px 0 #0b6623, 12px 12px 0 3px #121820;
      width: 100%;
      max-width: 440px;
      padding: 2.2rem;
      position: relative;
    }

    /* カード上部の斜めヒーローバッジラベル */
    .hero-badge {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      background: var(--mha-yellow);
      color: #121820;
      font-family: 'Bangers', cursive;
      font-size: 1.2rem;
      letter-spacing: 2px;
      padding: 0.3rem 1.2rem;
      border: 3px solid #121820;
      box-shadow: 4px 4px 0 var(--mha-orange);
      white-space: nowrap;
    }

    /* 言語切替ボタン群: 各ボタンのサイズ固定とテキスト折り返し防止 */
    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 0.8rem;
      margin-bottom: 1.2rem;
      align-items: center;
    }

    .lang-btn {
      min-width: 52px;              /* 全ボタンの基本横幅を統一 */
      height: 32px;                 /* 高さを固定してレイアウト崩れを防止 */
      padding: 0 8px;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #334155;
      background-color: #0f172a;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;          /* 文字列の自動改行を無効化 */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease-in-out;
    }

    .lang-btn.active, .lang-btn:hover {
      background-color: var(--mha-yellow);
      color: #121820;
      border-color: #121820;
    }

    /* フォームタイトル (アメコミ調シャドウ付き) */
    .form-title {
      font-family: 'Bangers', sans-serif;
      font-size: 2.3rem;
      text-align: center;
      color: #ffffff;
      text-shadow: 3px 3px 0 var(--mha-orange), 5px 5px 0 #121820;
      letter-spacing: 1px;
      margin-bottom: 1.2rem;
    }

    /* 状態通知バナー (エラーメッセージまたは登録完了通知) */
    .status-alert {
      display: none;                /* 初期状態は非表示 */
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      text-align: center;
      line-height: 1.4;
    }

    /* 認証失敗・エラー通知スタイル (オレンジ背景) */
    .status-alert.error {
      background: rgba(255, 87, 34, 0.15);
      border: 2px solid var(--mha-orange);
      color: #ffccbc;
    }

    /* 登録成功通知スタイル (グリーン背景) */
    .status-alert.success {
      background: rgba(0, 255, 135, 0.15);
      border: 2px solid var(--mha-bright-green);
      color: var(--mha-bright-green);
    }

    /* フォームグループ */
    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--mha-bright-green);
      margin-bottom: 0.4rem;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0d1117;
      border: 2px solid #334155;
      color: #ffffff;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--mha-bright-green);
    }

    /* ログインボタン: ヒロアカ調グラデーション＆発光シャドウ */
    .btn-submit {
      width: 100%;
      margin-top: 0.8rem;
      padding: 0.85rem;
      font-family: 'Bangers', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 1.5px;
      background: linear-gradient(45deg, var(--mha-yellow), var(--mha-orange));
      border: 3px solid #121820;
      color: #121820;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--mha-bright-green);
      transition: all 0.15s ease-in-out;
    }

    .btn-submit:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #ffffff;
    }

    /* ポートフォリオ審査員向けワンクリックアカウント入力セクション */
    .quick-section {
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px dashed #334155;
      text-align: center;
    }

    .quick-title {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .quick-btn-group {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: #0f172a;
      border: 2px solid #334155;
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .quick-btn:hover {
      border-color: var(--mha-bright-green);
      color: var(--mha-bright-green);
    }

    /* 下部リンク (会員登録画面への誘導) */
    .bottom-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .bottom-link a {
      color: var(--mha-yellow);
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
    }

    /* 会員登録用モーダル (オーバーレイ) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: var(--mha-panel-bg);
      border: 4px solid var(--mha-yellow);
      box-shadow: 10px 10px 0 var(--mha-orange);
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      padding: 2rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="login-card">
  <!-- 装飾バッジ -->
  <div class="hero-badge">PLUS ULTRA! ENTRANCE</div>

  <!-- 多言語切り替えボタン -->
  <div class="lang-switch">
    <button class="lang-btn active" id="btnKo" onclick="changeLang('ko')">한국어</button>
    <button class="lang-btn" id="btnJa" onclick="changeLang('ja')">日本語</button>
    <button class="lang-btn" id="btnEn" onclick="changeLang('en')">English</button>
  </div>

  <h2 class="form-title" id="t-title">HERO LOGIN</h2>

  <!-- サーバーからのリダイレクト通知メッセージ表示用バナー -->
  <div class="status-alert" id="statusAlert"></div>

  <!-- ログイン送信フォーム (相対パス api/login へPOST送信) -->
  <form action="api/login" method="POST" id="loginForm">
    <!-- バックエンドサーブレットの後方互換用hiddenフィールド (id, password) -->
    <input type="hidden" name="id" id="hiddenId">
    <input type="hidden" name="password" id="hiddenPassword">

    <div class="form-group">
      <label class="form-label" id="t-idLabel">히어로 아이디 (ID)</label>
      <input type="text" name="userId" id="userId" class="form-input" placeholder="영문/숫자 4~20자" required>
    </div>

    <div class="form-group">
      <label class="form-label" id="t-pwLabel">비밀번호 (PASSWORD)</label>
      <input type="password" name="userPw" id="userPw" class="form-input" placeholder="비밀번호 입력" required>
    </div>

    <button type="submit" class="btn-submit" id="t-submitBtn">SMASH LOGIN!</button>
  </form>

  <!-- ポートフォリオ審査用ワンクリックアカウント入力ボタン群 -->
  <div class="quick-section">
    <div class="quick-title" id="t-quickTitle">💡 포트폴리오 심사용 원클릭 계정 입력</div>
    <div class="quick-btn-group">
      <button type="button" class="quick-btn" onclick="setAccount('test1', '1234')">👤 일반 (test1)</button>
      <button type="button" class="quick-btn" onclick="setAccount('admin', '1234')">👑 관리자 (admin)</button>
      <button type="button" class="quick-btn" onclick="setAccount('kenji', '1234')">⚡ kenji</button>
    </div>
  </div>

  <!-- 新規登録画面(join.html)への遷移リンク -->
  <div class="bottom-link">
    <span id="t-joinNotice">계정이 아직 없으신가요?</span>
    <a href="join.html" id="t-joinLink">히어로 회원가입</a>
  </div>
</div>

<!-- 会員登録用モーダルウィンドウ (レガシー互換用) -->
<div class="modal-overlay" id="joinModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('joinModal')">&times;</button>
    <h3 style="font-family: 'Bangers'; font-size: 2rem; color: var(--mha-yellow); text-align: center; margin-bottom: 1.2rem;" id="t-modalJoinTitle">BECOME A HERO</h3>
    <!-- 会員登録API (api/join) への直接送信フォーム -->
    <form action="api/join" method="POST" style="display: flex; flex-direction: column; gap: 0.9rem;">
      <input type="text" name="userId" id="modalUserId" class="form-input" placeholder="희망 아이디 (영문/숫자)" required>
      <input type="password" name="userPw" id="modalUserPw" class="form-input" placeholder="비밀번호" required>
      <input type="text" name="userName" id="modalUserName" class="form-input" placeholder="히어로 네임 (닉네임)" required>
      <button type="submit" class="btn-submit" id="t-modalJoinBtn">등록 완료</button>
    </form>
  </div>
</div>

<script>
  /**
   * 多言語辞書オブジェクト (韓国語 / 日本語 / 英語)
   * 【機能】ラベル、プレースホルダー、アラートメッセージを各言語へ動的に置換します。
   */
  const i18n = {
    ko: {
      title: "HERO LOGIN",
      idLabel: "히어로 아이디 (ID)",
      pwLabel: "비밀번호 (PASSWORD)",
      idPlaceholder: "영문/숫자 4~20자",
      pwPlaceholder: "비밀번호 입력",
      submitBtn: "SMASH LOGIN!",
      quickTitle: "💡 포트폴리오 심사용 원클릭 계정 입력",
      joinNotice: "계정이 아직 없으신가요?",
      joinLink: "히어로 회원가입",
      modalJoinTitle: "BECOME A HERO",
      modalJoinBtn: "등록 완료",
      modalIdPlaceholder: "희망 아이디 (영문/숫자)",
      modalPwPlaceholder: "비밀번호",
      modalNamePlaceholder: "히어로 네임 (닉네임)",
      errNotFound: "아이디 또는 비밀번호가 일치하지 않습니다.",
      errDuplicate: "이미 등록된 히어로 아이디입니다.",
      errServer: "서버 연결 또는 데이터베이스 오류가 발생했습니다.",
      regSuccess: "히어로 등록이 완료되었습니다! 로그인해 주세요."
    },
    ja: {
      title: "HERO ログイン",
      idLabel: "ヒーローID (ユーザーID)",
      pwLabel: "パスワード (PASSWORD)",
      idPlaceholder: "英数字4~20文字",
      pwPlaceholder: "パスワードを入力",
      submitBtn: "SMASH LOGIN!",
      quickTitle: "💡 ポートフォリオ審査用ワンクリック入力",
      joinNotice: "アカウントをお持ちでないですか？",
      joinLink: "新規ヒーロー登録",
      modalJoinTitle: "ヒーロー登録",
      modalJoinBtn: "登録完了",
      modalIdPlaceholder: "希望ヒーローID (英数字)",
      modalPwPlaceholder: "パスワード",
      modalNamePlaceholder: "ヒーローネーム (ニックネーム)",
      errNotFound: "ユーザーIDまたはパスワードが一致しません。",
      errDuplicate: "既に存在するヒーローIDです。",
      errServer: "サーバー接続またはデータベースエラーが発生しました。",
      regSuccess: "ヒーロー登録が完了しました！ログインしてください。"
    },
    en: {
      title: "HERO LOGIN",
      idLabel: "HERO ID",
      pwLabel: "PASSWORD",
      idPlaceholder: "4-20 alphanumeric characters",
      pwPlaceholder: "Enter password",
      submitBtn: "SMASH LOGIN!",
      quickTitle: "💡 Quick Account for Reviewers",
      joinNotice: "Don't have an account?",
      joinLink: "Sign Up Here",
      modalJoinTitle: "BECOME A HERO",
      modalJoinBtn: "COMPLETE SIGN UP",
      modalIdPlaceholder: "Desired Hero ID",
      modalPwPlaceholder: "Password",
      modalNamePlaceholder: "Hero Name (Nickname)",
      errNotFound: "Invalid Hero ID or Password.",
      errDuplicate: "Hero ID already exists.",
      errServer: "Server or Database connection failed.",
      regSuccess: "Hero registration complete! Please log in."
    }
  };

  let currentLang = 'ko'; // デフォルト表示言語

  /**
   * 言語切り替え処理
   * @param {string} lang - 選択された言語コード ('ko', 'ja', 'en')
   */
  function changeLang(lang) {
    currentLang = lang;

    // ボタンのアクティブ状態更新
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    if (lang === 'ko') document.getElementById('btnKo').classList.add('active');
    if (lang === 'ja') document.getElementById('btnJa').classList.add('active');
    if (lang === 'en') document.getElementById('btnEn').classList.add('active');

    // UIテキストおよびプレースホルダーの更新
    const t = i18n[lang];
    document.getElementById('t-title').innerText = t.title;
    document.getElementById('t-idLabel').innerText = t.idLabel;
    document.getElementById('t-pwLabel').innerText = t.pwLabel;
    document.getElementById('userId').placeholder = t.idPlaceholder;
    document.getElementById('userPw').placeholder = t.pwPlaceholder;
    document.getElementById('t-submitBtn').innerText = t.submitBtn;
    document.getElementById('t-quickTitle').innerText = t.quickTitle;
    document.getElementById('t-joinNotice').innerText = t.joinNotice;
    document.getElementById('t-joinLink').innerText = t.joinLink;
    document.getElementById('t-modalJoinTitle').innerText = t.modalJoinTitle;
    document.getElementById('t-modalJoinBtn').innerText = t.modalJoinBtn;
    document.getElementById('modalUserId').placeholder = t.modalIdPlaceholder;
    document.getElementById('modalUserPw').placeholder = t.modalPwPlaceholder;
    document.getElementById('modalUserName').placeholder = t.modalNamePlaceholder;

    // 現在表示されている通知バナーの文言を再レンダリング
    checkStatusMessage();
  }

  /**
   * フォーム送信前イベントリスナー
   * 【機能】バックエンドの各サーブレットが (userId, userPw) または (id, password)
   *        どちらの名前でリクエストを読み込んでも正常に受け取れるようhidden値を同期します。
   */
  document.getElementById('loginForm').addEventListener('submit', function() {
    const uId = document.getElementById('userId').value;
    const uPw = document.getElementById('userPw').value;
    document.getElementById('hiddenId').value = uId;
    document.getElementById('hiddenPassword').value = uPw;
  });

  /**
   * 審査用ワンクリックアカウント自動入力関数
   * @param {string} id - アカウントID
   * @param {string} pw - パスワード
   */
  function setAccount(id, pw) {
    document.getElementById('userId').value = id;
    document.getElementById('userPw').value = pw;
    document.getElementById('hiddenId').value = id;
    document.getElementById('hiddenPassword').value = pw;
  }

  /* モーダル表示/非表示ヘルパー関数 */
  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  /**
   * サーバーリダイレクトパラメータ検知および通知バナー表示関数
   * 【機能】URLクエリ文字列(?registered=1, ?error=...)を解析し、適切なステータスバナーを表示します。
   */
  function checkStatusMessage() {
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const registered = urlParams.get('registered');
    const alertBox = document.getElementById('statusAlert');

    // 会員登録成功時 (?registered=1) -> 成功バナー(緑)
    if (registered === '1') {
      alertBox.className = 'status-alert success';
      alertBox.style.display = 'block';
      alertBox.innerText = i18n[currentLang].regSuccess;
    }
    // 認証失敗時 (?error=1) -> エラーバナー(橙)
    else if (error === '1') {
      alertBox.className = 'status-alert error';
      alertBox.style.display = 'block';
      alertBox.innerText = i18n[currentLang].errNotFound;
    }
    // ID重複時 (?error=duplicate) -> エラーバナー(橙)
    else if (error === 'duplicate') {
      alertBox.className = 'status-alert error';
      alertBox.style.display = 'block';
      alertBox.innerText = i18n[currentLang].errDuplicate;
    }
    // DBまたはサーバー接続エラー時 (?error=server) -> エラーバナー(橙)
    else if (error === 'server') {
      alertBox.className = 'status-alert error';
      alertBox.style.display = 'block';
      alertBox.innerText = i18n[currentLang].errServer;
    }
    // パラメータがない場合は非表示
    else {
      alertBox.style.display = 'none';
    }
  }

  // DOM読み込み完了時にURLパラメータを自動チェック
  window.addEventListener('DOMContentLoaded', checkStatusMessage);
</script>
</body>
</html>
