<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="editTitle">AniLog - HERO REVIEW EDIT</title>

  <!-- Google Fonts: アメコミ調英字フォント(Bangers) および 日韓フォントの読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    /* ===================================================
       ヒロアカ(僕のヒーローアカデミア) テーマカラー変数定義
       =================================================== */
    :root {
      --mha-green: #0b6623;         /* デクのコスチューム基本グリーン */
      --mha-teal: #0fa37f;          /* アクセントティールグリーン */
      --mha-bright-green: #00ff87;  /* 発光グリーン(ラベル・フォーカス用) */
      --mha-yellow: #ffde00;        /* タイトル・ボタン強調イエロー */
      --mha-orange: #ff5722;        /* 爆豪風アクセントオレンジ */
      --mha-dark: #121820;          /* 境界線・シャドウ用ダーク */
      --mha-panel-bg: #1c2430;      /* パネル背景ダークスレート */
      --comic-border: 3px solid #121820; /* アメコミ調の太枠境界線 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 背景: アメコミ印刷風のハーフトーン・ドットパターン背景 */
    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      background-image:
              radial-gradient(var(--mha-panel-bg) 15%, transparent 16%),
              radial-gradient(var(--mha-dark) 15%, transparent 16%);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    /* レビュー編集メインコンテナ (カードパネル) */
    .edit-container {
      background-color: var(--mha-panel-bg);
      width: 100%;
      max-width: 720px;
      padding: 35px 30px;
      border: 4px solid var(--mha-teal);
      border-radius: 16px;
      box-shadow: 12px 12px 0 #0b6623, 12px 12px 0 3px #121820;
      position: relative;
    }

    /* パネル上部の斜めヒーローバッジラベル */
    .hero-badge {
      position: absolute;
      top: -18px;
      left: 30px;
      transform: rotate(-2deg);
      background: var(--mha-yellow);
      color: #121820;
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      padding: 0.3rem 1.2rem;
      border: 3px solid #121820;
      box-shadow: 4px 4px 0 var(--mha-orange);
      white-space: nowrap;
    }

    /* ヘッダーバー: タイトルと多言語切替ボタンの配置 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 25px;
      border-bottom: 3px solid var(--mha-yellow);
      padding-bottom: 15px;
    }

    .header-bar h2 {
      margin: 0;
      font-family: 'Bangers', sans-serif;
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 2px 2px 0 var(--mha-orange), 4px 4px 0 #121820;
      letter-spacing: 1.5px;
    }

    /* 言語切替ボタン群 */
    .lang-group { display: flex; gap: 5px; align-items: center; }
    .lang-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #334155;
      background-color: #0f172a;
      color: #94a3b8;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .lang-btn.active, .lang-btn:hover {
      background-color: var(--mha-yellow);
      color: #121820;
      border-color: #121820;
    }

    /* 入力フォーム共通グループ */
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: var(--mha-bright-green);
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      background: #0d1117;
      border: 2px solid #334155;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--mha-bright-green);
    }

    textarea { resize: vertical; min-height: 140px; line-height: 1.6; }
    .notice { font-size: 12px; color: #94a3b8; margin-top: 5px; }

    /* ===================================================
       AI再分析パネル (発目明のサポートアイテム風ラボデザイン)
       =================================================== */
    .ai-panel {
      background: #16202c;
      border: 2px solid var(--mha-teal);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
    }
    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .ai-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--mha-bright-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-btn {
      background: linear-gradient(45deg, var(--mha-yellow), var(--mha-orange));
      color: #121820;
      border: 2px solid #121820;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 2px 2px 0 var(--mha-bright-green);
      transition: 0.15s;
    }
    .ai-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #ffffff;
    }
    .ai-result {
      font-size: 13px;
      color: #e2e8f0;
      display: none;
      line-height: 1.6;
      border-top: 1px dashed #334155;
      padding-top: 10px;
      margin-top: 8px;
    }
    .ai-tag-badge {
      display: inline-block;
      background-color: rgba(15, 163, 127, 0.25);
      color: var(--mha-bright-green);
      border: 1px solid var(--mha-teal);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
      margin-top: 5px;
    }

    /* 画像プレビュー表示枠 (既存画像または新規画像) */
    .preview-box {
      margin-top: 10px;
      text-align: center;
      background-color: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 2px dashed #334155;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 4px;
      object-fit: contain;
    }

    /* 下部ボタングループ */
    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }
    .btn {
      padding: 10px 22px;
      font-size: 15px;
      border-radius: 6px;
      border: 2px solid #121820;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease-in-out;
    }
    /* 修正保存ボタン */
    .btn-update {
      font-family: 'Bangers', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 1px;
      background: linear-gradient(45deg, var(--mha-yellow), var(--mha-orange));
      color: #121820;
      box-shadow: 4px 4px 0 var(--mha-bright-green);
    }
    .btn-update:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #ffffff;
    }
    .btn-back {
      background-color: #334155;
      color: #ffffff;
      box-shadow: 4px 4px 0 #0f172a;
    }
    .btn-back:hover {
      background-color: #475569;
      transform: translate(-1px, -1px);
    }
  </style>
</head>
<body>

<div class="edit-container">
  <!-- 装飾バッジ -->
  <div class="hero-badge">HERO MISSION : EDIT REVIEW</div>

  <!-- ヘッダーエリア (タイトル & 言語切替) -->
  <div class="header-bar">
    <h2 data-i18n="editTitle">HERO REVIEW EDIT</h2>
    <div class="lang-group">
      <span style="font-size: 14px;">🌐</span>
      <button type="button" class="lang-btn" id="btnJa" onclick="changeLanguage('ja')">日本語</button>
      <button type="button" class="lang-btn" id="btnKo" onclick="changeLanguage('ko')">한국어</button>
      <button type="button" class="lang-btn" id="btnEn" onclick="changeLanguage('en')">EN</button>
    </div>
  </div>

  <!-- レビュー修正フォーム: multipart/form-dataにより画像アップロードとテキストを同時送信 -->
  <form action="api/board" method="post" enctype="multipart/form-data">
    <!-- サーブレット側の分岐用hidden値: action=update[cite: 1] -->
    <input type="hidden" name="action" value="update">
    <!-- 修正対象のレビュー番号(BNO)[cite: 1] -->
    <input type="hidden" id="bno" name="bno" value="">
    <!-- 既存画像ファイル名保持用 (新しいファイルが選択されない場合に維持)[cite: 1] -->
    <input type="hidden" id="existingImage" name="existingImage" value="">

    <!-- 1. アニメ作品名入力欄 -->
    <div class="form-group">
      <label for="animeTitle" data-i18n="animeTitleLabel">アニメ作品名</label>
      <input type="text" id="animeTitle" name="animeTitle" required>
    </div>

    <!-- 2. レビュータイトル入力欄 -->
    <div class="form-group">
      <label for="title" data-i18n="postTitleLabel">レビュータイトル</label>
      <input type="text" id="title" name="title" required>
    </div>

    <!-- 3. レビュー本文テキストエリア -->
    <div class="form-group">
      <label for="content" data-i18n="postContentLabel">感想・レビュー本文</label>
      <textarea id="content" name="content" required></textarea>
    </div>

    <!-- 4. AI感情分析＆星評価アシスタントパネル -->
    <div class="ai-panel">
      <div class="ai-header">
        <span class="ai-title">🤖 AniLog AI レビュー感情分析＆星評価アシスタント</span>
        <button type="button" class="ai-btn" onclick="runAiIntelligence()">AI再分析</button>
      </div>
      <!-- AI分析結果レンダリング領域 (初期状態は非表示) -->
      <div id="aiResult" class="ai-result">
        <div><b>感情判定:</b> <span id="aiSentiment" style="font-weight: bold; color: var(--mha-bright-green);">-</span> (<span id="aiScore" style="color: var(--mha-yellow);">0%</span>)</div>
        <div style="margin-top: 4px;"><b>AI要約:</b> <span id="aiSummary" style="color: #cbd5e1;">-</span></div>
        <div id="aiTagsContainer" style="margin-top: 6px;"></div>
      </div>
    </div>

    <!-- 5. 評価(星評価)セレクトボックス -->
    <div class="form-group">
      <label for="rating" data-i18n="ratingLabel">評価（星評価）</label>
      <select id="rating" name="rating">
        <option value="5" data-i18n-opt="rating5">★★★★★ (5点 - 最高 / PLUS ULTRA)</option>
        <option value="4" data-i18n-opt="rating4">★★★★☆ (4点 - 良い)</option>
        <option value="3" data-i18n-opt="rating3">★★★☆☆ (3点 - 普通)</option>
        <option value="2" data-i18n-opt="rating2">★★☆☆☆ (2点 - 微妙)</option>
        <option value="1" data-i18n-opt="rating1">★☆☆☆☆ (1点 - 不満)</option>
      </select>
    </div>

    <!-- 6. サムネイル画像再添付 & プレビュー表示枠 -->
    <div class="form-group">
      <label for="animeImage" data-i18n="imageLabel">アニメ画像・ポスター添付</label>
      <input type="file" id="animeImage" name="animeImage" accept="image/*" onchange="previewNewImage(event)">
      <div class="notice" data-i18n="keepImageNotice">※新しい画像を選択しない場合、既存の画像が維持されます。</div>
      <div class="preview-box" id="previewBox" style="display: none;">
        <img id="imgPreview" src="" alt="Preview">
      </div>
    </div>

    <!-- 7. アクションボタン: 一覧へ戻る & 修正保存実行 -->
    <div class="btn-row">
      <a href="board.html" class="btn btn-back" data-i18n="backToList">一覧へ戻る</a>
      <button type="submit" class="btn btn-update" data-i18n="updateBtn">SMASH! 修正保存</button>
    </div>
  </form>
</div>

<!-- 多言語辞書スクリプトの読み込み -->
<script src="lang.js"></script>
<script>
  // URLクエリパラメータからレビュー番号(bno)を取得
  const urlParams = new URLSearchParams(window.location.search);
  const bno = urlParams.get('bno');
  let originalImageSrc = ''; // 既存画像パス保持用変数

  /**
   * 初期データ並列取得および権限検証処理
   * 【機能】1. ログイン状態の確認 (api/auth)
   *        2. 対象レビュー情報の取得 (api/board?bno=X)[cite: 1]
   *        3. 作成者本人以外のアクセスを弾くセキュリティチェック
   */
  Promise.all([
    fetch('api/auth').then(res => res.json()),
    bno ? fetch(`api/board?bno=${bno}`).then(res => res.json()) : Promise.resolve(null)
  ])
          .then(([authData, postData]) => {
            // 1. 未ログインチェック
            if (!authData || !authData.loginId) {
              alert(currentLang === 'ko' ? "로그인이 필요한 서비스입니다." : currentLang === 'en' ? "Please sign in first." : "ログインが必要です。");
              location.href = "login.html";
              return;
            }

            // 2. 記事存在チェック
            if (!bno || !postData || !postData.bno) {
              alert(currentLang === 'ko' ? "존재하지 않는 리뷰이거나 잘못된 접근입니다." : currentLang === 'en' ? "Invalid review ID." : "存在しないレビューまたは不正なアクセスです。");
              location.href = "board.html";
              return;
            }

            // 3. 権限チェック (ログイン中のIDと記事の作成者IDが一致しているか)
            if (postData.writer !== authData.loginId) {
              alert(currentLang === 'ko' ? "본인이 작성한 리뷰만 수정할 수 있습니다." : currentLang === 'en' ? "You can only edit your own reviews." : "本人が作成したレビューのみ編集可能です。");
              location.href = "board.html";
              return;
            }

            // 既存データをフォーム各項目へバインド
            document.getElementById('bno').value = postData.bno;
            document.getElementById('animeTitle').value = postData.animeTitle || '';
            document.getElementById('rating').value = postData.rating || '5';
            document.getElementById('title').value = postData.title || '';
            document.getElementById('content').value = postData.content || '';

            // 既存画像が存在する場合、プレビューを表示
            if (postData.imageFile && postData.imageFile.trim() !== '') {
              document.getElementById('existingImage').value = postData.imageFile;
              originalImageSrc = `uploads/${postData.imageFile}`;
              document.getElementById('imgPreview').src = originalImageSrc;
              document.getElementById('previewBox').style.display = 'block';
            }
          })
          .catch(err => {
            console.error("初期データロード失敗:", err);
            location.href = "board.html";
          });

  /**
   * 新規アップロード画像ローカルプレビュー関数
   * 【機能】新しくファイルが選択されたらFileReaderで表示。選択が解除されたら既存画像へ復帰。
   */
  function previewNewImage(event) {
    const input = event.target;
    const previewBox = document.getElementById('previewBox');
    const imgPreview = document.getElementById('imgPreview');

    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imgPreview.src = e.target.result;
        previewBox.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    } else if (originalImageSrc) {
      // ファイル選択キャンセル時: 元の既存画像を表示維持
      imgPreview.src = originalImageSrc;
      previewBox.style.display = 'block';
    } else {
      previewBox.style.display = 'none';
    }
  }

  /**
   * AIテキスト再分析実行関数
   * 【機能】編集中のタイトル・本文を抽出し、AIサーブレット(/api/intelligence)へPOST送信して結果を動的表示。
   */
  function runAiIntelligence() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();

    if (!title && !content) {
      alert(currentLang === 'ko' ? "분석할 제목 또는 본문 내용을 입력해 주세요." : currentLang === 'en' ? "Please enter title or content." : "分析するタイトルまたは本文を入力してください。");
      return;
    }

    const params = new URLSearchParams();
    params.append('title', title);
    params.append('content', content);

    fetch('api/intelligence', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
      body: params.toString()
    })
            .then(res => res.json())
            .then(data => {
              // 分析結果パネルの可視化
              document.getElementById('aiResult').style.display = 'block';

              // 感情判定ラベルと信頼度スコアの設定
              document.getElementById('aiSentiment').innerText = data.sentimentLabel;
              document.getElementById('aiScore').innerText = "信頼度 " + data.sentimentScore;

              // 要約文の反映
              document.getElementById('aiSummary').innerText = data.aiSummary;

              // 推奨評価(星評価)の自動選択
              if (data.recommendedRating) {
                document.getElementById('rating').value = data.recommendedRating;
              }

              // 抽出タグバッジの生成
              const tagsBox = document.getElementById('aiTagsContainer');
              tagsBox.innerHTML = '<b>自動抽出タグ:</b> ';
              data.tags.forEach(tag => {
                const badge = document.createElement('span');
                badge.className = 'ai-tag-badge';
                badge.innerText = tag;
                tagsBox.appendChild(badge);
              });
            })
            .catch(err => {
              console.error("AI Intelligence Error:", err);
            });
  }
</script>
</body>
</html>
