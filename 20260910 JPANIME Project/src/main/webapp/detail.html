<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">AniLog - HERO REVIEW DETAIL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mha-green: #0b6623;
            --mha-teal: #0fa37f;
            --mha-bright-green: #00ff87;
            --mha-yellow: #ffde00;
            --mha-orange: #ff5722;
            --mha-dark: #121820;
            --mha-panel-bg: #1c2430;
            --comic-border: 3px solid #121820;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            background-image:
                    radial-gradient(var(--mha-panel-bg) 15%, transparent 16%),
                    radial-gradient(var(--mha-dark) 15%, transparent 16%);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .detail-container {
            background-color: var(--mha-panel-bg);
            width: 100%;
            max-width: 800px;
            padding: 35px 30px;
            border: 4px solid var(--mha-teal);
            border-radius: 16px;
            box-shadow: 12px 12px 0 #0b6623, 12px 12px 0 3px #121820;
            position: relative;
        }

        .hero-badge {
            position: absolute;
            top: -18px;
            left: 30px;
            transform: rotate(-2deg);
            background: var(--mha-yellow);
            color: #121820;
            font-family: 'Bangers', cursive;
            font-size: 1.1rem;
            letter-spacing: 2px;
            padding: 0.3rem 1.2rem;
            border: 3px solid #121820;
            box-shadow: 4px 4px 0 var(--mha-orange);
            white-space: nowrap;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--mha-yellow);
            padding-bottom: 15px;
        }

        .top-bar h2 {
            margin: 0;
            font-family: 'Bangers', sans-serif;
            font-size: 2.2rem;
            color: #ffffff;
            text-shadow: 2px 2px 0 var(--mha-orange), 4px 4px 0 #121820;
            letter-spacing: 1.5px;
        }

        /* 언어 선택 버튼 (크기 고정) */
        .lang-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .lang-btn {
            min-width: 52px;
            height: 32px;
            padding: 0 8px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease-in-out;
        }

        .lang-btn.active, .lang-btn:hover {
            background-color: var(--mha-yellow);
            color: #121820;
            border-color: #121820;
        }

        /* 헤더 메타데이터 */
        .anime-badge {
            display: inline-block;
            background: rgba(15, 163, 127, 0.2);
            border-left: 4px solid var(--mha-bright-green);
            color: var(--mha-bright-green);
            padding: 0.3rem 0.8rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 0.8rem;
        }

        .review-main-title {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.4;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: #0f172a;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        .meta-row span b {
            color: #f1f5f9;
        }

        .rating-badge {
            font-family: 'Bangers', cursive;
            font-size: 1.1rem;
            color: var(--mha-yellow);
            letter-spacing: 1px;
        }

        /* 포스터 이미지 */
        .post-image-box {
            margin-bottom: 1.5rem;
            text-align: center;
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 2px dashed #334155;
            display: none;
        }

        .post-image-box img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 6px;
            object-fit: contain;
        }

        /* 본문 */
        .review-content {
            background: #16202c;
            border: 2px solid #28374a;
            border-radius: 8px;
            padding: 1.5rem;
            font-size: 1rem;
            line-height: 1.8;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 150px;
            margin-bottom: 2rem;
        }

        /* 버튼 모음 */
        .btn-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px dashed #334155;
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group-right {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            font-size: 14px;
            border-radius: 6px;
            border: 2px solid #121820;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease-in-out;
        }

        .btn-list {
            background-color: #334155;
            color: #ffffff;
            box-shadow: 3px 3px 0 #0f172a;
        }
        .btn-list:hover { background-color: #475569; transform: translate(-1px, -1px); }

        .btn-edit {
            background: linear-gradient(45deg, var(--mha-yellow), var(--mha-orange));
            color: #121820;
            box-shadow: 3px 3px 0 var(--mha-bright-green);
            display: none;
        }
        .btn-edit:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #ffffff; }

        .btn-delete {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 3px 3px 0 #7f1d1d;
            display: none;
        }
        .btn-delete:hover { background: #dc2626; transform: translate(-1px, -1px); }

        /* 댓글 섹션 */
        .comment-section {
            margin-top: 1rem;
        }

        .comment-title {
            font-family: 'Bangers', sans-serif;
            font-size: 1.6rem;
            color: var(--mha-yellow);
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comment-input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .comment-input-box input {
            flex: 1;
            padding: 10px 14px;
            background: #0d1117;
            border: 2px solid #334155;
            color: #ffffff;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .comment-input-box input:focus { border-color: var(--mha-bright-green); }

        .btn-comment {
            font-family: 'Bangers', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--mha-yellow), var(--mha-orange));
            color: #121820;
            border: 2px solid #121820;
            padding: 0 18px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--mha-bright-green);
            transition: 0.15s;
        }
        .btn-comment:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #ffffff; }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .comment-writer {
            font-weight: bold;
            color: var(--mha-bright-green);
        }

        .comment-body {
            font-size: 0.92rem;
            color: #f1f5f9;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="detail-container">
    <div class="hero-badge">HERO MISSION : REVIEW ARCHIVE</div>

    <div class="top-bar">
        <h2>HERO REVIEW DETAIL</h2>
        <div class="lang-group">
            <span style="font-size: 14px;">🌐</span>
            <button type="button" class="lang-btn" id="btnJa" onclick="changeLang('ja')">日本語</button>
            <button type="button" class="lang-btn active" id="btnKo" onclick="changeLang('ko')">한국어</button>
            <button type="button" class="lang-btn" id="btnEn" onclick="changeLang('en')">EN</button>
        </div>
    </div>

    <div id="loading" style="text-align: center; padding: 2rem; color: #94a3b8;">
        리뷰 데이터를 불러오는 중입니다...
    </div>

    <div id="contentArea" style="display: none;">
        <div>
            <span class="anime-badge" id="animeTitle"></span>
        </div>
        <h1 class="review-main-title" id="title"></h1>

        <div class="meta-row">
            <span><span id="t-writer">작성자</span>: <b id="writer"></b></span>
            <span><span id="t-date">등록일</span>: <span id="regDate"></span></span>
            <span><span id="t-hit">조회수</span>: <span id="hitCount"></span></span>
            <span class="rating-badge" id="ratingText"></span>
        </div>

        <div class="post-image-box" id="imageBox">
            <img id="detailImg" src="" alt="Anime Image">
        </div>

        <div class="review-content" id="content"></div>

        <div class="btn-row">
            <a href="board.html" class="btn btn-list" id="t-btnList">목록으로</a>
            <div class="btn-group-right">
                <button type="button" class="btn btn-edit" id="btnEdit" onclick="goEdit()">수정</button>
                <button type="button" class="btn btn-delete" id="btnDelete" onclick="deletePost()">삭제</button>
            </div>
        </div>

        <!-- 댓글 영역 -->
        <div class="comment-section">
            <div class="comment-title">
                <span>💬 HERO COMMENTS</span> (<span id="commentCount">0</span>)
            </div>

            <div class="comment-input-box">
                <input type="text" id="commentInput" placeholder="응원이나 코멘트를 남겨보세요! (PLUS ULTRA)">
                <button type="button" class="btn-comment" onclick="submitComment()" id="t-btnComment">등록</button>
            </div>

            <div class="comment-list" id="commentList"></div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const bno = urlParams.get('bno');
    let currentReview = null;
    let currentUser = null;
    let currentLang = 'ko';

    const i18n = {
        ko: {
            writer: "작성자",
            date: "등록일",
            hit: "조회수",
            btnList: "목록으로",
            btnEdit: "수정",
            btnDelete: "삭제",
            btnComment: "등록",
            placeholder: "응원이나 코멘트를 남겨보세요! (PLUS ULTRA)",
            deleteConfirm: "정말 이 리뷰를 삭제하시겠습니까?",
            emptyComment: "댓글 내용을 입력해 주세요."
        },
        ja: {
            writer: "投稿者",
            date: "登録日",
            hit: "閲覧数",
            btnList: "一覧へ",
            btnEdit: "修正",
            btnDelete: "削除",
            btnComment: "投稿",
            placeholder: "感想や応援コメントを残しましょう！(PLUS ULTRA)",
            deleteConfirm: "本当にこのレビューを削除しますか？",
            emptyComment: "コメント内容を入力してください。"
        },
        en: {
            writer: "Author",
            date: "Date",
            hit: "Views",
            btnList: "Back to List",
            btnEdit: "Edit",
            btnDelete: "Delete",
            btnComment: "Submit",
            placeholder: "Leave your comment or critique! (PLUS ULTRA)",
            deleteConfirm: "Are you sure you want to delete this review?",
            emptyComment: "Please enter your comment."
        }
    };

    function changeLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        if (lang === 'ko') document.getElementById('btnKo').classList.add('active');
        if (lang === 'ja') document.getElementById('btnJa').classList.add('active');
        if (lang === 'en') document.getElementById('btnEn').classList.add('active');

        const t = i18n[lang];
        document.getElementById('t-writer').innerText = t.writer;
        document.getElementById('t-date').innerText = t.date;
        document.getElementById('t-hit').innerText = t.hit;
        document.getElementById('t-btnList').innerText = t.btnList;
        document.getElementById('btnEdit').innerText = t.btnEdit;
        document.getElementById('btnDelete').innerText = t.btnDelete;
        document.getElementById('t-btnComment').innerText = t.btnComment;
        document.getElementById('commentInput').placeholder = t.placeholder;
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!bno) {
            alert("잘못된 접근입니다.");
            location.href = "board.html";
            return;
        }

        // 1. 세션 정보 확인 & 2. 게시글 상세 조회
        Promise.all([
            fetch('/api/auth').then(res => res.json()).catch(() => ({})),
            fetch(`/api/board?bno=${bno}`).then(res => res.json())
        ])
            .then(([auth, post]) => {
                currentUser = auth;
                currentReview = post;

                if (!post || !post.bno) {
                    alert("게시글을 찾을 수 없습니다.");
                    location.href = "board.html";
                    return;
                }

                // 화면 렌더링
                document.getElementById('animeTitle').innerText = post.animeTitle;
                document.getElementById('title').innerText = post.title;
                document.getElementById('writer').innerText = post.writer;
                document.getElementById('regDate').innerText = post.regDate;
                document.getElementById('hitCount').innerText = post.hitCount || 0;
                document.getElementById('ratingText').innerText = '★'.repeat(post.rating || 5) + ' (' + (post.rating || 5) + '.0)';
                document.getElementById('content').innerText = post.content;

                if (post.imageFile && post.imageFile.trim() !== '') {
                    const imgBox = document.getElementById('imageBox');
                    const detailImg = document.getElementById('detailImg');
                    detailImg.src = `uploads/${encodeURIComponent(post.imageFile)}`;
                    imgBox.style.display = 'block';
                }

                // 본인 작성글일 경우 수정/삭제 버튼 노출
                if (auth && auth.loginId && auth.loginId === post.writer) {
                    document.getElementById('btnEdit').style.display = 'inline-flex';
                    document.getElementById('btnDelete').style.display = 'inline-flex';
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('contentArea').style.display = 'block';

                loadComments();
            })
            .catch(err => {
                console.error("데이터 로드 실패:", err);
                document.getElementById('loading').innerText = "데이터를 불러오는 도중 오류가 발생했습니다.";
            });
    });

    function goEdit() {
        location.href = `edit.html?bno=${bno}`;
    }

    function deletePost() {
        if (!confirm(i18n[currentLang].deleteConfirm)) return;

        fetch(`api/board?bno=${bno}&action=delete`, { method: 'POST' })
            .then(res => {
                alert("리뷰가 삭제되었습니다.");
                location.href = "board.html";
            })
            .catch(err => alert("삭제 실패: " + err));
    }

    // 댓글 목록 조회
    function loadComments() {
        fetch(`api/comments?bno=${bno}`)
            .then(res => res.json())
            .then(comments => {
                const list = document.getElementById('commentList');
                const count = document.getElementById('commentCount');
                list.innerHTML = '';
                count.innerText = comments ? comments.length : 0;

                if (!comments || comments.length === 0) {
                    list.innerHTML = '<div style="color:#64748b; font-size:0.85rem; padding: 10px 0;">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</div>';
                    return;
                }

                comments.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'comment-item';
                    item.innerHTML = `
            <div class="comment-header">
              <span class="comment-writer">${escapeHtml(c.writer)}</span>
              <span>${c.regDate || ''}</span>
            </div>
            <div class="comment-body">${escapeHtml(c.content)}</div>
          `;
                    list.appendChild(item);
                });
            })
            .catch(err => console.error("댓글 로드 실패:", err));
    }

    // 댓글 등록 함수
    function submitComment() {
        const input = document.getElementById('commentInput');
        const content = input.value.trim();

        if (!content) {
            alert(i18n[currentLang].emptyComment);
            return;
        }

        const params = new URLSearchParams();
        params.append('bno', bno);
        params.append('content', content);

        fetch('/api/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
            body: params.toString()
        })
            .then(res => {
                if (res.status === 401) {
                    alert(currentLang === 'ja' ? 'ログインが必要です。' : (currentLang === 'en' ? 'Please log in first.' : '로그인이 필요한 기능입니다.'));
                    location.href = 'login.html';
                    throw new Error('Unauthorized');
                }
                if (!res.ok) throw new Error('등록 실패');
                return res.json();
            })
            .then(data => {
                input.value = '';
                loadComments(); // 댓글 새로고침
            })
            .catch(err => {
                if (err.message !== 'Unauthorized') {
                    console.error("댓글 에러:", err);
                }
            });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
</script>
</body>
</html>
