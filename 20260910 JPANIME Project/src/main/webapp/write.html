<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="writeTitle">AniLog - HERO REVIEW POST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --mha-green: #0b6623;
      --mha-teal: #0fa37f;
      --mha-bright-green: #00ff87;
      --mha-yellow: #ffde00;
      --mha-orange: #ff5722;
      --mha-dark: #121820;
      --mha-panel-bg: #1c2430;
      --comic-border: 3px solid #121820;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      background-image:
              radial-gradient(var(--mha-panel-bg) 15%, transparent 16%),
              radial-gradient(var(--mha-dark) 15%, transparent 16%);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .write-container {
      background-color: var(--mha-panel-bg);
      width: 100%;
      max-width: 720px;
      padding: 35px 30px;
      border: 4px solid var(--mha-teal);
      border-radius: 16px;
      box-shadow: 12px 12px 0 #0b6623, 12px 12px 0 3px #121820;
      position: relative;
    }

    .hero-badge {
      position: absolute;
      top: -18px;
      left: 30px;
      transform: rotate(-2deg);
      background: var(--mha-yellow);
      color: #121820;
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      padding: 0.3rem 1.2rem;
      border: 3px solid #121820;
      box-shadow: 4px 4px 0 var(--mha-orange);
      white-space: nowrap;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 25px;
      border-bottom: 3px solid var(--mha-yellow);
      padding-bottom: 15px;
    }

    .header-bar h2 {
      margin: 0;
      font-family: 'Bangers', sans-serif;
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 2px 2px 0 var(--mha-orange), 4px 4px 0 #121820;
      letter-spacing: 1.5px;
    }

    .lang-group {
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .lang-btn {
        min-width: 52px;              /* 세 버튼 모두 일정한 기본 너비 유지 */
        height: 32px;                 /* 고정 높이 지정으로 크기 들쑥날쑥 방지 */
        padding: 0 8px;
        font-size: 12px;
        font-weight: bold;
        border: 2px solid #334155;
        background-color: #0f172a;
        color: #94a3b8;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;          /* 핵심: 글자가 절대 두 줄로 꺾이지 않음 */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease-in-out;
    }

    .lang-btn.active, .lang-btn:hover {
        background-color: var(--mha-yellow);
        color: #121820;
        border-color: #121820;
    }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: var(--mha-bright-green);
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      background: #0d1117;
      border: 2px solid #334155;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--mha-bright-green);
    }

    textarea { resize: vertical; min-height: 140px; line-height: 1.6; }

    /* AI Analysis Panel - MHA Tech Lab Style */
    .ai-panel {
      background: #16202c;
      border: 2px solid var(--mha-teal);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
    }
    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .ai-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--mha-bright-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-btn {
      background: linear-gradient(45deg, var(--mha-yellow), var(--mha-orange));
      color: #121820;
      border: 2px solid #121820;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 2px 2px 0 var(--mha-bright-green);
      transition: 0.15s;
    }
    .ai-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #ffffff;
    }
    .ai-result {
      font-size: 13px;
      color: #e2e8f0;
      display: none;
      line-height: 1.6;
      border-top: 1px dashed #334155;
      padding-top: 10px;
      margin-top: 8px;
    }
    .ai-tag-badge {
      display: inline-block;
      background-color: rgba(15, 163, 127, 0.25);
      color: var(--mha-bright-green);
      border: 1px solid var(--mha-teal);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
      margin-top: 5px;
    }

    .preview-box {
      margin-top: 10px;
      display: none;
      text-align: center;
      background-color: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 2px dashed #334155;
    }
    .preview-box img { max-width: 100%; max-height: 220px; border-radius: 4px; }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }
    .btn {
      padding: 10px 22px;
      font-size: 15px;
      border-radius: 6px;
      border: 2px solid #121820;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease-in-out;
    }
    .btn-save {
      font-family: 'Bangers', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 1px;
      background: linear-gradient(45deg, var(--mha-yellow), var(--mha-orange));
      color: #121820;
      box-shadow: 4px 4px 0 var(--mha-bright-green);
    }
    .btn-save:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #ffffff;
    }
    .btn-back {
      background-color: #334155;
      color: #ffffff;
      box-shadow: 4px 4px 0 #0f172a;
    }
    .btn-back:hover {
      background-color: #475569;
      transform: translate(-1px, -1px);
    }
  </style>
</head>
<body>

<div class="write-container">
  <div class="hero-badge">HERO MISSION : REVIEW ARCHIVE</div>

  <div class="header-bar">
    <h2 data-i18n="writeTitle">HERO REVIEW POST</h2>
    <div class="lang-group">
      <span style="font-size: 14px;">🌐</span>
      <button type="button" class="lang-btn" id="btnJa" onclick="changeLanguage('ja')">日本語</button>
      <button type="button" class="lang-btn active" id="btnKo" onclick="changeLanguage('ko')">한국어</button>
      <button type="button" class="lang-btn" id="btnEn" onclick="changeLanguage('en')">EN</button>
    </div>
  </div>

  <form action="api/board" method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="animeTitle" data-i18n="animeTitleLabel">애니메이션 작품명</label>
      <input type="text" id="animeTitle" name="animeTitle" placeholder="예: 나의 히어로 아카데미아, 주술회전" required>
    </div>

    <div class="form-group">
      <label for="title" data-i18n="postTitleLabel">리뷰 제목</label>
      <input type="text" id="title" name="title" placeholder="리뷰 요약 또는 개성 넘치는 제목을 입력하세요" required>
    </div>

    <div class="form-group">
      <label for="content" data-i18n="postContentLabel">감상평 및 본문 내용</label>
      <textarea id="content" name="content" placeholder="애니메이션에 대한 솔직하고 열정적인 감상을 남겨주세요 (PLUS ULTRA!)" required></textarea>
    </div>

    <!-- AI 인텔리전스 분석 패널 -->
    <div class="ai-panel">
      <div class="ai-header">
        <span class="ai-title">🤖 AniLog AI 감정 분석 & 별점 서포터</span>
        <button type="button" class="ai-btn" onclick="runAiIntelligence()">AI 자동 분석</button>
      </div>
      <div id="aiResult" class="ai-result">
        <div><b>감정 판정:</b> <span id="aiSentiment" style="font-weight: bold; color: var(--mha-bright-green);">-</span> (<span id="aiScore" style="color: var(--mha-yellow);">0%</span>)</div>
        <div style="margin-top: 4px;"><b>AI 핵심 요약:</b> <span id="aiSummary" style="color: #cbd5e1;">-</span></div>
        <div id="aiTagsContainer" style="margin-top: 6px;"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="rating" data-i18n="ratingLabel">히어로 평가 (별점)</label>
      <select id="rating" name="rating">
        <option value="5" data-i18n-opt="rating5">★★★★★ (5점 - 최고의 명작 / PLUS ULTRA)</option>
        <option value="4" data-i18n-opt="rating4">★★★★☆ (4점 - 훌륭한 작화와 연출)</option>
        <option value="3" data-i18n-opt="rating3">★★★☆☆ (3점 - 무난한 킬링타임)</option>
        <option value="2" data-i18n-opt="rating2">★★☆☆☆ (2점 - 다소 아쉬운 전개)</option>
        <option value="1" data-i18n-opt="rating1">★☆☆☆☆ (1점 - 불만족)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="animeImage" data-i18n="imageLabel">작품 포스터 / 스크린샷 첨부</label>
      <input type="file" id="animeImage" name="animeImage" accept="image/*" onchange="previewImage(event)">
      <div class="preview-box" id="previewBox">
        <img id="imgPreview" src="" alt="Preview">
      </div>
    </div>

    <div class="btn-row">
      <a href="board.html" class="btn btn-back" data-i18n="backToList">목록으로 돌아가기</a>
      <button type="submit" class="btn btn-save" data-i18n="saveBtn">SMASH! 리뷰 등록</button>
    </div>
  </form>
</div>

<script src="lang.js"></script>
<script>
  // AI 텍스트 분석 실행
  function runAiIntelligence() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();

    if (!title && !content) {
      alert("분석할 제목 또는 본문 내용을 먼저 입력해 주세요.");
      return;
    }

    const params = new URLSearchParams();
    params.append('title', title);
    params.append('content', content);

    fetch('api/intelligence', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
      body: params.toString()
    })
            .then(res => res.json())
            .then(data => {
              document.getElementById('aiResult').style.display = 'block';
              document.getElementById('aiSentiment').innerText = data.sentimentLabel;
              document.getElementById('aiScore').innerText = "신뢰도 " + data.sentimentScore;
              document.getElementById('aiSummary').innerText = data.aiSummary;

              if (data.recommendedRating) {
                document.getElementById('rating').value = data.recommendedRating;
              }

              const tagsBox = document.getElementById('aiTagsContainer');
              tagsBox.innerHTML = '<b>추출 태그:</b> ';
              data.tags.forEach(tag => {
                const badge = document.createElement('span');
                badge.className = 'ai-tag-badge';
                badge.innerText = tag;
                tagsBox.appendChild(badge);
              });
            })
            .catch(err => {
              console.error("AI Intelligence Error:", err);
            });
  }

  // 이미지 미리보기
  function previewImage(event) {
    const input = event.target;
    const previewBox = document.getElementById('previewBox');
    const imgPreview = document.getElementById('imgPreview');

    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imgPreview.src = e.target.result;
        previewBox.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      previewBox.style.display = 'none';
    }
  }
</script>
</body>
</html>
