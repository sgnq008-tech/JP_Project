<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="boardTitle">アニメ感想・評価コミュニティ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 15px;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
    }
    .board-container {
      background-color: white;
      width: 100%;
      max-width: 1000px;
      padding: 30px 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e63946;
      padding-bottom: 12px;
    }
    .header-bar h2 { margin: 0; color: #e63946; font-size: 22px; }
    .lang-group { display: flex; gap: 5px; }
    .lang-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #e63946;
      background-color: white;
      color: #e63946;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active { background-color: #e63946; color: white; }
    .user-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px 15px;
      background-color: #f8f9fa;
      border-radius: 6px;
    }
    .user-info { font-size: 14px; font-weight: bold; color: #333; }
    .btn-group { display: flex; gap: 8px; }
    .btn {
      padding: 7px 14px;
      font-size: 13px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }
    .btn-logout { background-color: #6c757d; color: white; }
    .btn-write { background-color: #e63946; color: white; }
    .btn-edit { background-color: #1d3557; color: white; }
    .btn-delete { background-color: #d90429; color: white; }

    /* AI 統計＆スマートランキングバナー */
    .ai-ranking-banner {
      background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
      color: white;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .ai-ranking-title { font-size: 14px; font-weight: bold; }
    .ai-ranking-list { display: flex; gap: 10px; font-size: 13px; flex-wrap: wrap; }
    .ai-ranking-chip {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 12px;
    }

    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dee2e6;
    }
    .tab-bar { display: flex; gap: 8px; }
    .tab-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #ced4da;
      background-color: #fff;
      color: #495057;
      border-radius: 20px;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: #1d3557;
      color: white;
      border-color: #1d3557;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-grow: 1;
      justify-content: flex-end;
    }
    .search-input {
      padding: 7px 12px;
      font-size: 13px;
      border: 1px solid #ced4da;
      border-radius: 20px;
      width: 220px;
      outline: none;
    }
    .search-input:focus { border-color: #e63946; }
    .sort-select {
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      background-color: white;
      outline: none;
      cursor: pointer;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .review-card {
      border: 1px solid #e9ecef;
      border-radius: 10px;
      overflow: hidden;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .review-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
    .card-img-wrap {
      width: 100%;
      height: 180px;
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-img-wrap .no-img {
      color: #adb5bd;
      font-size: 32px;
    }
    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .anime-badge {
      display: inline-block;
      align-self: flex-start;
      background-color: #f1faee;
      color: #1d3557;
      border: 1px solid #a8dadc;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: #212529;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .stars {
      color: #ffb703;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #868e96;
      border-top: 1px solid #f1f3f5;
      padding-top: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: #888;
      grid-column: 1 / -1;
      font-size: 15px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      max-height: 88vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #aaa;
    }
    .modal-close:hover { color: #333; }
    .modal-img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 15px;
      background-color: #f8f9fa;
    }
    .modal-content-text {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    /* AI 類似推薦ボックス */
    .ai-recom-box {
      background-color: #f1faee;
      border: 1px dashed #457b9d;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .ai-recom-title { font-weight: bold; color: #1d3557; margin-bottom: 4px; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
      margin-bottom: 15px;
    }
    .comment-section h4 { margin: 0 0 10px 0; font-size: 15px; color: #1d3557; }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      max-height: 160px;
      overflow-y: auto;
    }
    .comment-item {
      background-color: #f8f9fa;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .comment-meta {
      display: flex;
      justify-content: space-between;
      color: #868e96;
      font-size: 11px;
      margin-bottom: 3px;
    }
    .comment-body { color: #333; word-break: break-word; }
    .comment-form { display: flex; gap: 8px; }
    .comment-input {
      flex-grow: 1;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      outline: none;
    }
    .comment-input:focus { border-color: #e63946; }
    .btn-comment {
      background-color: #1d3557;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="board-container">
  <div class="header-bar">
    <h2 data-i18n="boardTitle">🍿 アニメ感想・評価コミュニティ</h2>
    <div class="lang-group">
      <span style="font-size: 12px; margin-top: 2px;">🌐</span>
      <button type="button" class="lang-btn" id="btnJa" onclick="switchLang('ja')">日本語</button>
      <button type="button" class="lang-btn" id="btnKo" onclick="switchLang('ko')">한국어</button>
      <button type="button" class="lang-btn" id="btnEn" onclick="switchLang('en')">EN</button>
    </div>
  </div>

  <div class="user-nav">
    <div class="user-info">
      <span id="loginUserName">...</span><span id="welcomeSuffix"></span>
    </div>
    <div class="btn-group">
      <form action="api/auth" method="post" style="margin: 0;">
        <button type="submit" class="btn btn-logout" data-i18n="logoutBtn">ログアウト</button>
      </form>
      <a href="write.html" class="btn btn-write" data-i18n="newPostBtn">レビュー作成</a>
    </div>
  </div>

  <!-- AI 知能型ランキングバナー -->
  <div class="ai-ranking-banner">
    <div class="ai-ranking-title">🤖 AI Pick: ユーザー高評価アニメ TOP 3</div>
    <div class="ai-ranking-list" id="aiTopList">
      <span>集計中...</span>
    </div>
  </div>

  <!-- コントロールバー -->
  <div class="control-bar">
    <div class="tab-bar">
      <button type="button" class="tab-btn active" id="tabAll" onclick="setTab('all')" data-i18n="allPostsTab">すべてのレビュー</button>
      <button type="button" class="tab-btn" id="tabMy" onclick="setTab('my')" data-i18n="myPostsTab">自分のレビュー</button>
    </div>
    <div class="filter-group">
      <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="検索..." oninput="handleSearch()">
      <select id="sortSelect" class="sort-select" onchange="handleSort()">
        <option value="latest" data-i18n-opt="sortLatest">最新順</option>
        <option value="ratingHigh" data-i18n-opt="sortRatingHigh">星評価の高い順</option>
        <option value="ratingLow" data-i18n-opt="sortRatingLow">星評価の低い順</option>
      </select>
    </div>
  </div>

  <!-- レビューグリッド -->
  <div class="card-grid" id="cardGrid">
    <div class="empty-state">読み込み中...</div>
  </div>
</div>

<!-- 詳細モーダル -->
<div class="modal" id="reviewModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div id="modalBody"></div>

    <!-- AI 類似作知能型レコメンドエリア -->
    <div class="ai-recom-box" id="aiRecomBox">
      <div class="ai-recom-title">💡 AI 知能型レコメンド: この作品が好きな方へのおすすめ</div>
      <div id="aiRecomText" style="color: #495057;">関連作品を分析中...</div>
    </div>

    <!-- アクションボタン -->
    <div class="modal-actions" id="modalActions"></div>

    <!-- コメント欄 -->
    <div class="comment-section">
      <h4 data-i18n="commentTitle">💬 コメント</h4>
      <div class="comment-list" id="commentList"></div>
      <form class="comment-form" onsubmit="submitComment(event)">
        <input type="text" id="commentInput" class="comment-input" data-i18n-placeholder="commentPlaceholder" placeholder="一言感想を残してください..." required>
        <button type="submit" class="btn-comment" data-i18n="commentSubmitBtn">登録</button>
      </form>
    </div>
  </div>
</div>

<script src="lang.js"></script>
<script>
  let currentLoginId = "";
  let currentLoginName = "";
  let allPostsData = [];
  let currentFilter = "all";
  let searchQuery = "";
  let currentSort = "latest";
  let activeModalBno = null;

  function switchLang(lang) {
    changeLanguage(lang);
    updateSuffix();
    renderCards();
  }

  fetch('api/auth')
          .then(res => res.json())
          .then(data => {
            if (!data.loginId) {
              location.href = 'login.html';
            } else {
              currentLoginId = data.loginId;
              currentLoginName = data.loginName || data.loginId;
              document.getElementById('loginUserName').innerText = currentLoginName;
              updateSuffix();
              loadBoardList();
            }
          })
          .catch(() => { location.href = 'login.html'; });

  function updateSuffix() {
    const suffixes = { ja: " 様、ようこそ！", ko: "님 환영합니다!", en: ", welcome!" };
    document.getElementById('welcomeSuffix').innerText = suffixes[currentLang] || suffixes.ja;
  }

  function setTab(filter) {
    currentFilter = filter;
    document.getElementById('tabAll').classList.toggle('active', filter === 'all');
    document.getElementById('tabMy').classList.toggle('active', filter === 'my');
    renderCards();
  }

  function handleSearch() {
    searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    renderCards();
  }

  function handleSort() {
    currentSort = document.getElementById('sortSelect').value;
    renderCards();
  }

  function loadBoardList() {
    fetch('api/board')
            .then(res => res.json())
            .then(posts => {
              allPostsData = posts || [];
              renderAiTopRanking();
              renderCards();
            });
  }

  // AI 知能型ランキングバナーの集計
  function renderAiTopRanking() {
    const banner = document.getElementById('aiTopList');
    if (!allPostsData || allPostsData.length === 0) {
      banner.innerHTML = '<span>レビューデータがありません</span>';
      return;
    }

    // 星5または4の高評価作品を抽出
    const topPicks = [...allPostsData]
            .filter(p => p.rating >= 4)
            .slice(0, 3);

    if (topPicks.length === 0) {
      banner.innerHTML = '<span>高評価レビュー収集中</span>';
      return;
    }

    banner.innerHTML = '';
    topPicks.forEach((p, idx) => {
      const chip = document.createElement('span');
      chip.className = 'ai-ranking-chip';
      chip.innerText = `👑 ${idx + 1}位: ${p.animeTitle} (★${p.rating})`;
      banner.appendChild(chip);
    });
  }

  // カード一覧描画
  function renderCards() {
    const container = document.getElementById('cardGrid');
    container.innerHTML = '';

    let list = (currentFilter === 'my')
            ? allPostsData.filter(p => p.writer === currentLoginId)
            : [...allPostsData];

    if (searchQuery !== "") {
      list = list.filter(p =>
              (p.animeTitle && p.animeTitle.toLowerCase().includes(searchQuery)) ||
              (p.title && p.title.toLowerCase().includes(searchQuery))
      );
    }

    if (currentSort === 'ratingHigh') {
      list.sort((a, b) => b.rating - a.rating);
    } else if (currentSort === 'ratingLow') {
      list.sort((a, b) => a.rating - b.rating);
    } else {
      list.sort((a, b) => b.bno - a.bno);
    }

    if (list.length === 0) {
      const noPostMessages = {
        ja: { my: "作成したレビューがありません。", all: "該当するアニメレビューがありません。" },
        ko: { my: "내가 작성한 리뷰가 없습니다.", all: "해당하는 애니메이션 리뷰가 없습니다." },
        en: { my: "You haven't written any reviews yet.", all: "No anime reviews match your query." }
      };
      const langMap = noPostMessages[currentLang] || noPostMessages.ja;
      const msg = (currentFilter === 'my') ? langMap.my : langMap.all;
      container.innerHTML = `<div class="empty-state">${msg}</div>`;
      return;
    }

    list.forEach(post => {
      const starCount = Math.min(Math.max(post.rating || 5, 1), 5);
      const starStr = "★".repeat(starCount) + "☆".repeat(5 - starCount);

      let imgHtml = '<span class="no-img">🎬</span>';
      if (post.imageFile && post.imageFile.trim() !== '') {
        imgHtml = `<img src="uploads/${post.imageFile}" alt="Anime Image">`;
      }

      const card = document.createElement('div');
      card.className = 'review-card';
      card.onclick = () => openModal(post);
      card.innerHTML = `
          <div class="card-img-wrap">${imgHtml}</div>
          <div class="card-body">
            <span class="anime-badge">${post.animeTitle}</span>
            <div class="card-title">${post.title}</div>
            <div class="stars">${starStr}</div>
            <div class="card-footer">
              <span>👤 ${post.writer}</span>
              <span>📅 ${post.regDate.substring(0, 10)}</span>
            </div>
          </div>
        `;
      container.appendChild(card);
    });
  }

  // モーダルオープン及びAI類似作レコメンド
  function openModal(post) {
    activeModalBno = post.bno;
    const starCount = Math.min(Math.max(post.rating || 5, 1), 5);
    const starStr = "★".repeat(starCount) + "☆".repeat(5 - starCount);

    let imgHtml = '';
    if (post.imageFile && post.imageFile.trim() !== '') {
      imgHtml = `<img src="uploads/${post.imageFile}" class="modal-img" alt="Poster">`;
    }

    document.getElementById('modalBody').innerHTML = `
        <span class="anime-badge">${post.animeTitle}</span>
        <h3 style="margin: 8px 0 10px 0; color:#1d3557;">${post.title}</h3>
        <div class="stars" style="font-size: 16px; margin-bottom: 12px;">${starStr} (${post.rating} / 5)</div>
        <div style="font-size: 12px; color: #868e96; margin-bottom: 15px;">
          投稿者: <b>${post.writer}</b> | 投稿日時: ${post.regDate}
        </div>
        ${imgHtml}
        <div class="modal-content-text">${post.content}</div>
      `;

    // AI 知能型類似作レコメンドの算出
    const recomBox = document.getElementById('aiRecomText');
    const otherPicks = allPostsData.filter(p => p.bno !== post.bno && p.rating >= 4);
    if (otherPicks.length > 0) {
      const randomPicks = otherPicks.slice(0, 2).map(p => `「${p.animeTitle}」`).join("、");
      recomBox.innerHTML = `このレビューを高評価したユーザーは ${randomPicks} にも高い関心を示しています。`;
    } else {
      recomBox.innerHTML = "他のレビューが登録されると、AIが作品間の類似度を自動マッチングします。";
    }

    // ボタン制御
    const modalActions = document.getElementById('modalActions');
    const editLabel = i18n[currentLang].editBtn || "編集";
    const deleteLabel = i18n[currentLang].deleteBtn || "削除";
    const closeLabel = i18n[currentLang].closeBtn || "閉じる";

    if (post.writer === currentLoginId) {
      modalActions.innerHTML = `
          <button class="btn btn-logout" onclick="closeModal()">${closeLabel}</button>
          <a href="edit.html?bno=${post.bno}" class="btn btn-edit">${editLabel}</a>
          <button class="btn btn-delete" onclick="deleteReview(${post.bno})">${deleteLabel}</button>
        `;
    } else {
      modalActions.innerHTML = `
          <button class="btn btn-logout" onclick="closeModal()">${closeLabel}</button>
        `;
    }

    loadComments(post.bno);
    document.getElementById('reviewModal').style.display = 'flex';
  }

  function deleteReview(bno) {
    const msg = i18n[currentLang].deleteConfirm || "このレビューを本当に削除しますか？";
    if (!confirm(msg)) return;

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = 'api/board';

    const actionInput = document.createElement('input');
    actionInput.type = 'hidden';
    actionInput.name = 'action';
    actionInput.value = 'delete';
    form.appendChild(actionInput);

    const bnoInput = document.createElement('input');
    bnoInput.type = 'hidden';
    bnoInput.name = 'bno';
    bnoInput.value = bno;
    form.appendChild(bnoInput);

    document.body.appendChild(form);
    form.submit();
  }

  function loadComments(bno) {
    const commentList = document.getElementById('commentList');
    commentList.innerHTML = '<div style="color:#aaa; font-size:12px;">コメント読み込み中...</div>';

    fetch(`api/comments?bno=${bno}`)
            .then(res => res.json())
            .then(comments => {
              commentList.innerHTML = '';
              if (!comments || comments.length === 0) {
                const emptyMsg = i18n[currentLang].noComments || "まだコメントがありません。";
                commentList.innerHTML = `<div style="color:#aaa; font-size:12px; padding:6px 0;">${emptyMsg}</div>`;
                return;
              }
              comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
              <div class="comment-meta">
                <b>👤 ${c.writer}</b>
                <span>${c.regDate}</span>
              </div>
              <div class="comment-body">${c.content}</div>
            `;
                commentList.appendChild(item);
              });
            })
            .catch(() => {
              commentList.innerHTML = '<div style="color:#e63946; font-size:12px;">コメントの読み込みに失敗しました。</div>';
            });
  }

  function submitComment(e) {
    e.preventDefault();
    if (!activeModalBno) return;

    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    if (!content) return;

    const params = new URLSearchParams();
    params.append('bno', activeModalBno);
    params.append('content', content);

    fetch('api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
      body: params.toString()
    })
            .then(res => res.json())
            .then(result => {
              if (result.success) {
                input.value = '';
                loadComments(activeModalBno);
              } else {
                alert("コメント登録に失敗しました。");
              }
            })
            .catch(() => {
              alert("サーバー通信エラーが発生しました。");
            });
  }

  function closeModal() {
    document.getElementById('reviewModal').style.display = 'none';
    activeModalBno = null;
  }

  window.onclick = function(e) {
    if (e.target === document.getElementById('reviewModal')) {
      closeModal();
    }
  };
</script>
</body>
</html>
