<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="loginTitle">ログイン</title>
  <style>
    /* ログイン画面のスタイル定義 */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f9;
    }
    .container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 340px;
    }
    .brand-title {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #e63946;
      margin-bottom: 5px;
    }
    .lang-group {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-bottom: 15px;
    }
    .lang-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #e63946;
      background-color: white;
      color: #e63946;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active {
      background-color: #e63946;
      color: white;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: #1d3557;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 14px;
      position: relative;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      color: #495057;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 36px 10px 10px;
      box-sizing: border-box;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #1d3557;
    }
    .toggle-pw {
      position: absolute;
      right: 10px;
      cursor: pointer;
      font-size: 14px;
      user-select: none;
      color: #868e96;
    }
    .save-id-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #6c757d;
      cursor: pointer;
    }
    .save-id-wrap input {
      margin: 0;
      cursor: pointer;
    }
    .error-msg {
      background-color: #ffe3e3;
      border: 1px solid #ffc9c9;
      color: #c92a2a;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background-color: #e63946;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 5px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #c92a36;
    }

    /* デモ用クイックログインボタン */
    .demo-box {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed #dee2e6;
      text-align: center;
    }
    .demo-title {
      font-size: 11px;
      color: #868e96;
      margin-bottom: 6px;
    }
    .demo-btn-group {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .demo-btn {
      background-color: #f1f3f5;
      border: 1px solid #ced4da;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: #495057;
      cursor: pointer;
    }
    .demo-btn:hover {
      background-color: #e9ecef;
    }

    .link {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #6c757d;
    }
    .link a {
      color: #1d3557;
      text-decoration: none;
      font-weight: bold;
      margin-left: 4px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="brand-title" data-i18n="siteBrand">🎬 アニログ (AniLog)</div>

  <!-- 多言語切り替えエリア -->
  <div class="lang-group">
    <span style="font-size: 12px; margin-top: 2px;">🌐</span>
    <button type="button" class="lang-btn" id="btnJa" onclick="switchLang('ja')">日本語</button>
    <button type="button" class="lang-btn" id="btnKo" onclick="switchLang('ko')">한국어</button>
    <button type="button" class="lang-btn" id="btnEn" onclick="switchLang('en')">EN</button>
  </div>

  <h2 data-i18n="loginTitle">ログイン</h2>
  <div id="errorMsg" class="error-msg"></div>

  <!-- ログインフォーム -->
  <form action="api/login" method="post" onsubmit="handleLoginSubmit()">
    <div class="form-group">
      <label for="userId" data-i18n="userId">ユーザーID</label>
      <div class="input-wrap">
        <input type="text" id="userId" name="userId" data-i18n-placeholder="idPlaceholder" placeholder="ユーザーIDを入力" required>
      </div>
    </div>

    <div class="form-group">
      <label for="userPw" data-i18n="userPw">パスワード</label>
      <div class="input-wrap">
        <input type="password" id="userPw" name="userPw" data-i18n-placeholder="pwPlaceholder" placeholder="パスワードを入力" required>
        <span class="toggle-pw" onclick="toggleVisibility('userPw', this)">👁️</span>
      </div>
    </div>

    <!-- ユーザーID保存チェックボックス -->
    <label class="save-id-wrap">
      <input type="checkbox" id="saveIdCheck">
      <span id="saveIdLabel">ユーザーIDを記憶する</span>
    </label>

    <button type="submit" class="btn-submit" data-i18n="loginBtn">ログイン</button>
  </form>

  <!-- テスト・ポートフォリオ用デモアカウント自動入力 -->
  <div class="demo-box">
    <div class="demo-title" id="demoTitle">💡 ポートフォリオ審査用クイック入力</div>
    <div class="demo-btn-group">
      <button type="button" class="demo-btn" onclick="fillDemo('test1', '1234')">👤 一般 (test1)</button>
      <button type="button" class="demo-btn" onclick="fillDemo('admin', '1234')">👑 管理者 (admin)</button>
      <button type="button" class="demo-btn" onclick="fillDemo('kenji', '1234')">⚡ kenji</button>
    </div>
  </div>

  <div class="link">
    <span data-i18n="noAccount">アカウントをお持ちでないですか？</span>
    <a href="join.html" data-i18n="joinBtn">新規会員登録</a>
  </div>
</div>

<script src="lang.js"></script>
<script>
  // パスワード表示／非表示切り替え
  function toggleVisibility(inputId, iconEl) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      iconEl.style.color = '#1d3557';
    } else {
      input.type = 'password';
      iconEl.style.color = '#868e96';
    }
  }

  // デモアカウント自動入力関数 (審査員向け)
  function fillDemo(id, pw) {
    document.getElementById('userId').value = id;
    document.getElementById('userPw').value = pw;
  }

  // フォーム送信時：ユーザーIDの保存処理
  function handleLoginSubmit() {
    const saveCheck = document.getElementById('saveIdCheck').checked;
    const userId = document.getElementById('userId').value.trim();
    if (saveCheck) {
      localStorage.setItem("savedUserId", userId);
    } else {
      localStorage.removeItem("savedUserId");
    }
  }

  // 言語切り替え
  function switchLang(lang) {
    changeLanguage(lang);
    updateErrorMessage();
    updateDynamicLabels();
  }

  // 動的ラベル翻訳の反映
  function updateDynamicLabels() {
    const labels = {
      ja: { saveId: "ユーザーIDを記憶する", demoTitle: "💡 ポートフォリオ審査用クイック入力" },
      ko: { saveId: "아이디 저장", demoTitle: "💡 포트폴리오 심사용 빠른 계정 입력" },
      en: { saveId: "Remember Username", demoTitle: "💡 Quick Demo Credentials" }
    };
    const cur = labels[currentLang] || labels.ja;
    document.getElementById('saveIdLabel').innerText = cur.saveId;
    document.getElementById('demoTitle').innerText = cur.demoTitle;
  }

  // エラーメッセージの判定と表示
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get("error");
  const errorDiv = document.getElementById("errorMsg");

  function updateErrorMessage() {
    if (!error) return;
    const messages = {
      ja: { "1": "ユーザーIDまたはパスワードが一致しません。", "server": "サーバーエラーが発生しました。" },
      ko: { "1": "아이디 또는 비밀번호가 일치하지 않습니다.", "server": "서버 오류가 발생했습니다." },
      en: { "1": "Invalid username or password.", "server": "A server error occurred. Please try again later." }
    };
    const map = messages[currentLang] || messages.ja;
    errorDiv.innerText = map[error] || (currentLang === 'ja' ? "ログイン失敗" : currentLang === 'ko' ? "로그인 실패" : "Login Failed");
    errorDiv.style.display = "block";
  }

  // 画面初期ロード処理
  document.addEventListener("DOMContentLoaded", () => {
    updateErrorMessage();
    updateDynamicLabels();

    // 保存されたIDの復元
    const savedId = localStorage.getItem("savedUserId");
    if (savedId) {
      document.getElementById('userId').value = savedId;
      document.getElementById('saveIdCheck').checked = true;
    }
  });
</script>
</body>
</html>
