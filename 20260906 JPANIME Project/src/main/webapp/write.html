<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="writeTitle">アニメの感想・レビュー投稿</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
    }
    .write-container {
      background-color: white;
      width: 100%;
      max-width: 680px;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e63946;
      padding-bottom: 12px;
    }
    .header-bar h2 { margin: 0; color: #e63946; font-size: 20px; }
    .lang-group { display: flex; gap: 5px; }
    .lang-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #e63946;
      background-color: white;
      color: #e63946;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active { background-color: #e63946; color: white; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #495057; font-size: 14px; }
    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 150px; }

    /* AI インテリジェンス・アシスタントパネル */
    .ai-panel {
      background: linear-gradient(135deg, #f0f7ff 0%, #e6f0fa 100%);
      border: 1px solid #b6d4fe;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .ai-title {
      font-size: 13px;
      font-weight: bold;
      color: #0b5ed7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-btn {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .ai-btn:hover { background-color: #0b5ed7; }
    .ai-result {
      font-size: 13px;
      color: #333;
      display: none;
      line-height: 1.5;
    }
    .ai-tag-badge {
      display: inline-block;
      background-color: #cfe2ff;
      color: #084298;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
      margin-top: 5px;
    }

    .preview-box {
      margin-top: 10px;
      display: none;
      text-align: center;
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #ced4da;
    }
    .preview-box img { max-width: 100%; max-height: 220px; border-radius: 4px; }
    .btn-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn {
      padding: 9px 18px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }
    .btn-save { background-color: #e63946; color: white; }
    .btn-back { background-color: #6c757d; color: white; }
  </style>
</head>
<body>
<div class="write-container">
  <div class="header-bar">
    <h2 data-i18n="writeTitle">アニメの感想・レビュー投稿</h2>
    <div class="lang-group">
      <span style="font-size: 12px; margin-top: 2px;">🌐</span>
      <button type="button" class="lang-btn" id="btnJa" onclick="changeLanguage('ja')">日本語</button>
      <button type="button" class="lang-btn" id="btnKo" onclick="changeLanguage('ko')">한국어</button>
      <button type="button" class="lang-btn" id="btnEn" onclick="changeLanguage('en')">EN</button>
    </div>
  </div>

  <form action="api/board" method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="animeTitle" data-i18n="animeTitleLabel">アニメ作品名</label>
      <input type="text" id="animeTitle" name="animeTitle" placeholder="例：僕のヒーローアカデミア、呪術廻戦" required>
    </div>

    <div class="form-group">
      <label for="title" data-i18n="postTitleLabel">レビュータイトル</label>
      <input type="text" id="title" name="title" placeholder="レビューの要約やタイトルを入力" required>
    </div>

    <div class="form-group">
      <label for="content" data-i18n="postContentLabel">感想・レビュー本文</label>
      <textarea id="content" name="content" placeholder="アニメの感想や考察を入力してください" required></textarea>
    </div>

    <!-- AI インテリジェンス分析アシスタントパネル -->
    <div class="ai-panel">
      <div class="ai-header">
        <span class="ai-title">🤖 AniLog AI レビュー感情分析＆星評価アシスタント</span>
        <button type="button" class="ai-btn" onclick="runAiIntelligence()">AI自動分析</button>
      </div>
      <div id="aiResult" class="ai-result">
        <div><b>感情判定:</b> <span id="aiSentiment" style="font-weight: bold; color:#0d6efd;">-</span> (<span id="aiScore">0%</span>)</div>
        <div style="margin-top: 4px;"><b>AI要約:</b> <span id="aiSummary" style="color: #555;">-</span></div>
        <div id="aiTagsContainer" style="margin-top: 6px;"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="rating" data-i18n="ratingLabel">評価（星評価）</label>
      <select id="rating" name="rating">
        <option value="5" data-i18n-opt="rating5">★★★★★ (5点 - 最高)</option>
        <option value="4" data-i18n-opt="rating4">★★★★☆ (4点 - 良い)</option>
        <option value="3" data-i18n-opt="rating3">★★★☆☆ (3点 - 普通)</option>
        <option value="2" data-i18n-opt="rating2">★★☆☆☆ (2点 - 微妙)</option>
        <option value="1" data-i18n-opt="rating1">★☆☆☆☆ (1点 - 不満)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="animeImage" data-i18n="imageLabel">アニメ画像・ポスター添付</label>
      <input type="file" id="animeImage" name="animeImage" accept="image/*" onchange="previewImage(event)">
      <div class="preview-box" id="previewBox">
        <img id="imgPreview" src="" alt="Preview">
      </div>
    </div>

    <div class="btn-row">
      <a href="board.html" class="btn btn-back" data-i18n="backToList">一覧へ戻る</a>
      <button type="submit" class="btn btn-save" data-i18n="saveBtn">レビュー登録</button>
    </div>
  </form>
</div>

<script src="lang.js"></script>
<script>
  // AI テキスト分析インテリジェンスの実行
  function runAiIntelligence() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();

    if (!title && !content) {
      alert("분석할 제목 또는 본문 내용을 먼저 입력해 주세요.");
      return;
    }

    const params = new URLSearchParams();
    params.append('title', title);
    params.append('content', content);

    fetch('api/intelligence', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
      body: params.toString()
    })
            .then(res => res.json())
            .then(data => {
              document.getElementById('aiResult').style.display = 'block';
              document.getElementById('aiSentiment').innerText = data.sentimentLabel;
              document.getElementById('aiScore').innerText = "信頼度 " + data.sentimentScore;
              document.getElementById('aiSummary').innerText = data.aiSummary;

              // 星評価セレクトボックスの自動マッチング
              if (data.recommendedRating) {
                document.getElementById('rating').value = data.recommendedRating;
              }

              // 自動抽出タグのバッジ描画
              const tagsBox = document.getElementById('aiTagsContainer');
              tagsBox.innerHTML = '<b>自動抽出タグ:</b> ';
              data.tags.forEach(tag => {
                const badge = document.createElement('span');
                badge.className = 'ai-tag-badge';
                badge.innerText = tag;
                tagsBox.appendChild(badge);
              });
            })
            .catch(err => {
              console.error("AI Intelligence Error:", err);
            });
  }

  // 画像プレビュー
  function previewImage(event) {
    const input = event.target;
    const previewBox = document.getElementById('previewBox');
    const imgPreview = document.getElementById('imgPreview');

    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imgPreview.src = e.target.result;
        previewBox.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      previewBox.style.display = 'none';
    }
  }
</script>
</body>
</html>
